# =============================================================================
# Self-Supervised Pretraining Configuration
# =============================================================================

data:
  train_txt: "/shared/scratch/0/home/v_nishchay_nilabh/oasis_data/train.txt"
  val_txt:   "/shared/scratch/0/home/v_nishchay_nilabh/oasis_data/val.txt"
  template_seg_path: "/shared/scratch/0/home/v_nishchay_nilabh/oasis_data/scans/OASIS_OAS1_0406_MR1/seg4_white_onehot.npy"
  seg_filename: "seg4_white_onehot.npy"
  input_seg_filename: "synthseg_white_onehot_v1.npy"

output:
  base_dir: "/shared/scratch/0/home/v_nishchay_nilabh/training_results/ssl_pretrain"
  checkpoint_subdir: "checkpoints"
  log_subdir: "logs"

model:
  target_size: [128, 128, 128]
  num_classes: 5
  seg_channels: 5
  head: bandlimited
  lowpass_size: 96

training:
  batch_size: 1
  num_epochs: 100
  num_workers: 0
  pin_memory: true
  learning_rate: 1.0e-4
  min_learning_rate: 1.0e-6
  weight_decay: 1.0e-5
  warmup_epochs: 5
  use_amp: true
  save_every: 10
  patience: 50
  max_grad_norm: 1.0

loss:
  class_weights: [0.1, 1.0, 1.0, 5.0, 1.0]

device:
  gpu: "cuda:0"
  cudnn_benchmark: true

resume:
  checkpoint_path: null
  weights_only: false

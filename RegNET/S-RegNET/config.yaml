# =============================================================================
# Seg-only Registration Configuration
# =============================================================================
# Configuration file for segmentation-only brain registration. Both inputs
# are 5-channel one-hot segmentation maps; the model warps template_seg
# toward sample_seg. Edit this file to customize paths, hyperparameters,
# and loss weights.

# -----------------------------------------------------------------------------
# Data Paths
# -----------------------------------------------------------------------------
data:
  # Training and validation data lists (text files; one path per line, each
  # pointing at the seg .npy of one subject — the dataset loader infers the
  # subject directory from the file path).
  train_txt: "/shared/scratch/0/home/v_nishchay_nilabh/oasis_data/train.txt"
  val_txt:   "/shared/scratch/0/home/v_nishchay_nilabh/oasis_data/val.txt"

  # Template subject seg (used as moving image for every registration).
  template_seg_path: "/shared/scratch/0/home/v_nishchay_nilabh/oasis_data/scans/OASIS_OAS1_0406_MR1/seg4_white_onehot.npy"

  # Template WM mesh, REPAIRED. FreeSurfer's own 0406 ?h.white self-intersects in
  # 660 faces / 0.1007% / 47 patches before any warp — about a fifth of the ~0.53%
  # measured on a pushed mesh. utils/repair_template_mesh.py relaxes those patches
  # to zero crossings by moving vertices only (faces untouched, so V-E+F and the
  # genus are unchanged); 1,950 verts moved, median 0.16 mm, 72% of it tangential.
  # Comment this out to fall back to the raw /meshes/ sibling, which is defective.
  template_wm_mesh_path: "/shared/scratch/0/home/v_nishchay_nilabh/oasis_data/meshes/OASIS_OAS1_0406_MR1/repaired/template_wm_mesh_repaired.npz"

  # File naming inside each subject directory.
  #   seg_filename       — the SUPERVISION TARGET. Every loss term scores against
  #                        this one: forward Dice/CE, the reverse branch, and the
  #                        λ prior.
  #   input_seg_filename — the network's 2nd INPUT. Point it at the SynthSeg
  #                        one-hot to train the deployment condition (SynthSeg in,
  #                        GT supervision) so the flow learns to denoise its input
  #                        rather than reproduce it. null reuses seg_filename,
  #                        i.e. the historical GT-in/GT-out setup.
  # Both are the 5-class map whose class 3 is the WHITE-SURFACE INTERIOR (built
  # by convert_one_hot.py / convert_synthseg_one_hot.py; see label_mapping.py for
  # why that is not the WM tissue label). The old seg4_onehot.npy is a different
  # grouping — do not mix the two in one run.
  seg_filename: "seg4_white_onehot.npy"
  input_seg_filename: "synthseg_white_onehot_v1.npy"

  # Surface + mesh supervision (off here; see config_meshsup.yaml). The pair
  # is written next to each subject's segs by utils/make_white_sdf.py: the
  # signed distance (mm, float16, native 256³ grid) to that subject's white
  # surface, and that surface's vertices in normalized coords. Both must be
  # set together, or neither.
  white_sdf_filename: null
  white_surf_filename: null
  # The same volume for the template — the subject->template direction of the
  # symmetric surface term is scored against it.
  template_white_sdf_path: null
  # fsaverage nomedialwall labels (ico7, lh+rh). The medial wall is an
  # artificial cut, not anatomy, and is dropped from the surface terms.
  cortex_labels_dir: "/shared/scratch/0/home/v_nishchay_nilabh/bandlimit_opt/fsaverage_labels"

# -----------------------------------------------------------------------------
# Output Configuration
# -----------------------------------------------------------------------------
output:
  # Runs land in <base_dir>/<YYYYMMDD_HHMMSS>/. Own this path — the previous
  # value pointed at v_mahith_reddy's scratch.
  base_dir: "/shared/scratch/0/home/v_nishchay_nilabh/training_results/synthseg_input"
  checkpoint_subdir: "checkpoints"
  log_subdir: "logs"
  viz_subdir: "viz_output"

# -----------------------------------------------------------------------------
# Model Architecture
# -----------------------------------------------------------------------------
model:
  target_size: [128, 128, 128]   # (D, H, W) — volume dims after resize
  num_classes: 5                 # incl. background (channel 0)
  seg_channels: 5

# -----------------------------------------------------------------------------
# Affine Pre-alignment
# -----------------------------------------------------------------------------
affine:
  enabled: true
  regularization_weight: 0.01
  orthogonality_weight: 0.0

# -----------------------------------------------------------------------------
# Training Hyperparameters
# -----------------------------------------------------------------------------
training:
  batch_size: 1
  num_epochs: 200
  num_workers: 0
  pin_memory: true

  learning_rate: 1.0e-4
  min_learning_rate: 1.0e-6
  weight_decay: 1.0e-5

  warmup_epochs: 15

  use_amp: true

  save_every: 10
  patience: 50
  max_grad_norm: 1.0

# -----------------------------------------------------------------------------
# Loss Function Weights
# -----------------------------------------------------------------------------
# Jacobian weight is 0.5 (not the original 0.01) because the loss uses the
# normalised top-K + pre-fold formulation, which has a different output
# scale than the old mean(ReLU(-det)).
#
# Plain first-order smoothness is intentionally absent — lambda_smoothness
# is the active first-order smoothness regularizer here.
loss:
  # Segmentation alignment
  dice:          0.8
  cross_entropy: 0.2
  class_weights: [0.1, 1.0, 1.0, 5.0, 1.0]

  # Surface distance, both directions summed (0 here = term off; the 192³
  # fine-tune uses 0.2 / 0.03). Needs data.white_sdf_filename.
  surface:       0.0
  surface_tail:  0.0

  # Mesh regularisers on the full pushed template mesh, each as excess over
  # the affine-aligned template's own geometry (0 here = terms off; the 192³
  # fine-tune uses 1.3 / 3.4 / 6.4).
  mesh_edge:     0.0
  mesh_lap:      0.0
  mesh_normal:   0.0

  # Geometric regularization
  bending:       0.02          # second-order smoothness
  jacobian:      0.15          # anti-folding; linear-neg + top-K + pre-fold barrier
  displacement:  0.01          # penalises large per-voxel displacements

  # Lambda-based adaptive regularization
  #   smoothness: mean( λ_avg · |∇φ|² )            [linear in λ]
  #   prior:      mean( (λ - target)² / (2σ²) )    with target = 1 - dilated_boundary(sample_seg), σ=0.3
  lambda_smoothness: 0.05
  lambda_prior:      0.05

  # Affine regularization (only active when affine.enabled: true)
  affine_reg:    0.01
  affine_ortho:  0.0

# -----------------------------------------------------------------------------
# Reproducibility
# -----------------------------------------------------------------------------
seed: 42

# -----------------------------------------------------------------------------
# Device Configuration
# -----------------------------------------------------------------------------
device:
  gpu: "cuda:1"
  cudnn_benchmark: true

# -----------------------------------------------------------------------------
# Visualization Settings (used by inference / run_inference_all)
# -----------------------------------------------------------------------------
visualization:
  num_samples: 30
  detailed_samples: 10
  seed: 42
  class_names:
    - "Background"
    - "Cortex"
    - "Other Brain"
    - "White Surface Interior"
    - "CSF"

# -----------------------------------------------------------------------------
# Resume Training
# -----------------------------------------------------------------------------
resume:
  checkpoint_path: null
  # Weights only — fresh optimizer, epoch counter back to 1, best dice /
  # surface reset. The right mode when the loss configuration changes.
  weights_only: false
